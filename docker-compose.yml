services:
  # Наш API сервис
  api:
    build: .
    container_name: secure_api_app
    expose:
      - "8000"
    pid: "host"
    environment:
      - REDIS_HOST=redis_cache
    depends_on:
      - redis

  # Сервис безопасности (База Redis)
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    expose:
      - "6379"

  # Входные ворота — Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: secure_nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  # Сборщик метрик — Prometheus
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus_monitor
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    expose:
      - "9090"
    depends_on:
      - api

  # Визуализатор графиков — Grafana
  grafana:
    image: grafana/grafana-oss:10.0.0
    container_name: grafana_dashboard
    ports:
      - "3000:3000" # Открываем Grafana на порту 3000
    depends_on:
      - prometheus